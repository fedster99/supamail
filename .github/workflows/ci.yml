name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm public-content:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  live-db:
    name: Live DB Reliability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: docker version
      - run: pnpm test:db:live

  greenmail-smoke:
    name: GreenMail SMTP/IMAP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The smoke exercises the live SMTP deliver + Sent/Drafts APPEND + draft
      # send/delete verbs end-to-end against a GreenMail container it manages.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      IMAP_ENCRYPTION_KEY: greenmail-ci-encryption-key
      IMAP_ALLOW_PRIVATE_HOSTS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: docker version
      - run: pnpm migrate
      - run: pnpm smoke:greenmail

  dovecot-smoke:
    name: Dovecot IMAP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      IMAP_ENCRYPTION_KEY: dovecot-ci-encryption-key
      IMAP_ALLOW_PRIVATE_HOSTS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: docker version
      - run: pnpm migrate
      - run: pnpm smoke:dovecot
