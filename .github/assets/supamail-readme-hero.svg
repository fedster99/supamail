<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">SupaMail architecture</title>
  <desc id="desc">SupaMail mirrors IMAP mailboxes into Postgres and exposes the data through SQL, a CLI, and a local MCP server.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#273127" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1440" height="520" rx="28" fill="#0b0d0c"/>
  <rect width="1440" height="520" rx="28" fill="url(#grid)" opacity=".58"/>
  <circle cx="1340" cy="-14" r="270" fill="#b7ff52" opacity=".05"/>
  <circle cx="104" cy="528" r="230" fill="#b7ff52" opacity=".04"/>

  <g transform="translate(72 62)">
    <rect width="36" height="36" rx="8" fill="#b7ff52"/>
    <path d="M9 12h18v3L18 21 9 15v-3Zm0 5.5 9 6 9-6V26H9v-8.5Z" fill="#0b0d0c"/>
    <text x="52" y="29" fill="#f5f1e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" letter-spacing="-1">SupaMail</text>
    <text x="0" y="83" fill="#f5f1e8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.8">Your mailbox, in Postgres.</text>
    <text x="0" y="118" fill="#aeb7ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">A reliable, self-hosted IMAP sync engine for apps and agents.</text>
  </g>

  <g transform="translate(72 242)" filter="url(#shadow)">
    <g>
      <rect width="246" height="156" rx="18" fill="#151a16" stroke="#3d493f"/>
      <text x="24" y="35" fill="#89948a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5">SOURCE</text>
      <path d="M24 59h36v27H24z" fill="none" stroke="#b7ff52" stroke-width="2"/>
      <path d="m25 61 17 13 17-13" fill="none" stroke="#b7ff52" stroke-width="2"/>
      <text x="76" y="79" fill="#f5f1e8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">IMAP mailbox</text>
      <text x="24" y="119" fill="#aeb7ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Folders · messages · flags</text>
      <text x="24" y="141" fill="#aeb7ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">MIME bodies · attachments</text>
    </g>

    <path d="M258 78h42" stroke="#b7ff52" stroke-width="2"/>
    <path d="m294 72 8 6-8 6" fill="none" stroke="#b7ff52" stroke-width="2"/>

    <g transform="translate(314)">
      <rect width="332" height="156" rx="18" fill="#b7ff52"/>
      <text x="24" y="35" fill="#394b21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">SUPAMAIL CORE</text>
      <text x="24" y="76" fill="#0b0d0c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="750">Incremental sync engine</text>
      <text x="24" y="108" fill="#263319" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Reconciliation · retries · health</text>
      <text x="24" y="132" fill="#263319" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Durable conversation projection</text>
    </g>

    <path d="M658 78h42" stroke="#b7ff52" stroke-width="2"/>
    <path d="m694 72 8 6-8 6" fill="none" stroke="#b7ff52" stroke-width="2"/>

    <g transform="translate(714)">
      <rect width="250" height="156" rx="18" fill="#151a16" stroke="#3d493f"/>
      <text x="24" y="35" fill="#89948a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5">MIRROR</text>
      <ellipse cx="47" cy="67" rx="22" ry="8" fill="none" stroke="#b7ff52" stroke-width="2"/>
      <path d="M25 67v27c0 4 10 8 22 8s22-4 22-8V67M25 80c0 4 10 8 22 8s22-4 22-8" fill="none" stroke="#b7ff52" stroke-width="2"/>
      <text x="84" y="78" fill="#f5f1e8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">Postgres</text>
      <text x="24" y="126" fill="#aeb7ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Queryable mailbox tables</text>
    </g>

    <path d="M976 78h42" stroke="#b7ff52" stroke-width="2"/>
    <path d="m1012 72 8 6-8 6" fill="none" stroke="#b7ff52" stroke-width="2"/>

    <g transform="translate(1032)">
      <rect width="264" height="156" rx="18" fill="#151a16" stroke="#3d493f"/>
      <text x="24" y="35" fill="#89948a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5">BUILD WITH</text>
      <g transform="translate(24 59)">
        <rect width="62" height="38" rx="8" fill="#232a24"/>
        <text x="31" y="25" text-anchor="middle" fill="#f5f1e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">SQL</text>
        <rect x="72" width="62" height="38" rx="8" fill="#232a24"/>
        <text x="103" y="25" text-anchor="middle" fill="#f5f1e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">CLI</text>
        <rect x="144" width="72" height="38" rx="8" fill="#232a24"/>
        <text x="180" y="25" text-anchor="middle" fill="#b7ff52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">MCP</text>
      </g>
      <text x="24" y="126" fill="#aeb7ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Read-only agent access</text>
    </g>
  </g>

  <g transform="translate(72 448)">
    <circle cx="6" cy="6" r="6" fill="#b7ff52"/>
    <text x="22" y="12" fill="#aeb7ad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">SELF-HOSTED</text>
    <circle cx="166" cy="6" r="6" fill="#b7ff52"/>
    <text x="182" y="12" fill="#aeb7ad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">MIT LICENSED</text>
    <circle cx="336" cy="6" r="6" fill="#b7ff52"/>
    <text x="352" y="12" fill="#aeb7ad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">TYPESCRIPT + NODE.JS</text>
  </g>
</svg>
