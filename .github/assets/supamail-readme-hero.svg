<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">SupaMail open-source mailbox mirror</title>
  <desc id="desc">SupaMail mirrors an IMAP mailbox into Postgres for access through SQL, a CLI, and a local MCP server.</desc>

  <rect width="1440" height="520" fill="#f4f5f2"/>
  <path d="M0 1h1440M0 519h1440" stroke="#e6e8e2"/>

  <g transform="translate(72 54)">
    <rect width="28" height="28" rx="7" fill="#14110d"/>
    <text x="14" y="19" text-anchor="middle" fill="#3ecf8e" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600">~</text>
    <text x="40" y="19" fill="#14110d" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600">supamail</text>
  </g>

  <g transform="translate(72 126)">
    <circle cx="4" cy="5" r="4" fill="#3ecf8e"/>
    <text x="18" y="10" fill="#7a7263" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing=".9">OPEN-SOURCE IMAP SYNC</text>

    <text x="0" y="80" fill="#14110d" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="58" font-weight="400" letter-spacing="-1.2">Your email is now</text>
    <text x="0" y="143" fill="#1f9d61" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="64" font-weight="400" font-style="italic" letter-spacing="-1.5">queryable.</text>

    <text x="0" y="195" fill="#403a31" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18">Mirror an IMAP mailbox into Postgres, then build</text>
    <text x="0" y="223" fill="#403a31" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18">with SQL, TypeScript, or MCP.</text>

    <g transform="translate(0 272)" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12">
      <text x="0" y="0" fill="#1f9d61">●</text>
      <text x="18" y="0" fill="#7a7263">SELF-HOSTED</text>
      <text x="126" y="0" fill="#1f9d61">●</text>
      <text x="144" y="0" fill="#7a7263">MIT</text>
      <text x="194" y="0" fill="#1f9d61">●</text>
      <text x="212" y="0" fill="#7a7263">TYPESCRIPT + NODE.JS</text>
    </g>
  </g>

  <g transform="translate(704 72)">
    <rect width="664" height="376" rx="12" fill="#13120e"/>
    <rect x=".5" y=".5" width="663" height="375" rx="11.5" fill="none" stroke="#27251e"/>

    <g transform="translate(28 30)" font-family="'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="0" y="13" fill="#b89ce0" font-size="12">~/supamail</text>
      <text x="82" y="13" fill="#3ecf8e" font-size="12">(main)</text>
      <text x="130" y="13" fill="#3ecf8e" font-size="12">$</text>
      <text x="146" y="13" fill="#ebe6d6" font-size="12">mailbox mirror</text>

      <line x1="0" y1="38" x2="608" y2="38" stroke="#28261f"/>

      <text x="0" y="73" fill="#7d7867" font-size="11" letter-spacing=".8">SOURCE</text>
      <text x="226" y="73" fill="#7d7867" font-size="11" letter-spacing=".8">SYNC ENGINE</text>
      <text x="466" y="73" fill="#7d7867" font-size="11" letter-spacing=".8">MIRROR</text>

      <text x="0" y="111" fill="#ebe6d6" font-size="19" font-weight="600">IMAP mailbox</text>
      <text x="226" y="111" fill="#7fdc9a" font-size="19" font-weight="600">SupaMail core</text>
      <text x="466" y="111" fill="#ebe6d6" font-size="19" font-weight="600">Postgres</text>

      <path d="M154 103h46" stroke="#3ecf8e" stroke-width="1.5"/>
      <path d="m194 98 7 5-7 5" fill="none" stroke="#3ecf8e" stroke-width="1.5"/>
      <path d="M396 103h44" stroke="#3ecf8e" stroke-width="1.5"/>
      <path d="m434 98 7 5-7 5" fill="none" stroke="#3ecf8e" stroke-width="1.5"/>

      <text x="0" y="143" fill="#8c877a" font-size="12">folders · messages</text>
      <text x="0" y="165" fill="#8c877a" font-size="12">flags · MIME bodies</text>

      <text x="226" y="143" fill="#8c877a" font-size="12">incremental sync</text>
      <text x="226" y="165" fill="#8c877a" font-size="12">retries · health</text>

      <text x="466" y="143" fill="#8c877a" font-size="12">durable tables</text>
      <text x="466" y="165" fill="#8c877a" font-size="12">conversation view</text>

      <line x1="0" y1="198" x2="608" y2="198" stroke="#28261f"/>

      <text x="0" y="232" fill="#7d7867" font-size="11" letter-spacing=".8">READ THE MIRROR YOUR WAY</text>

      <text x="0" y="269" fill="#e689a8" font-size="14">SQL</text>
      <text x="42" y="269" fill="#7d7867" font-size="14">select subject from imap_messages;</text>

      <text x="0" y="300" fill="#e8c46a" font-size="14">CLI</text>
      <text x="42" y="300" fill="#7d7867" font-size="14">search · message · thread · folders</text>

      <text x="0" y="331" fill="#7fdc9a" font-size="14">MCP</text>
      <text x="42" y="331" fill="#7d7867" font-size="14">five local, read-only agent tools</text>
    </g>
  </g>
</svg>
